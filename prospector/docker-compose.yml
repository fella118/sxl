# The SOGIXEL AI employee + HTTPS. Put the secrets in .env (see .env.example), then: docker compose up -d
services:
  employee:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data      # master list + employee state
      - ./out:/app/out        # daily queues and reports
    restart: unless-stopped
  caddy:
    image: caddy:2.8.4
    command: caddy reverse-proxy --from ${DOMAIN} --to employee:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    restart: unless-stopped
volumes:
  caddy_data:
