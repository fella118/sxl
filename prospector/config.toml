# SOGIXEL prospector — who we look for and how much we do each day.

[market]
cities = ["Casablanca", "Rabat", "Marrakech", "Tanger", "Agadir", "Fès"]
tier1_cities = ["Casablanca", "Rabat", "Marrakech", "Tanger"]
language = "fr"
region = "MA"
pages_per_query = 3            # Places returns max 20 results per page, 60 per query

# One niche, three verticals: same owner, same funnel (lead -> consultation -> high-ticket treatment).
[[verticals]]
key = "aesthetic"
label = "médecine esthétique"
queries = ["clinique esthétique", "médecine esthétique", "centre laser esthétique"]
match = ["esthet", "aesthetic", "laser", "botox", "injection", "dermato", "beaute medicale", "skin"]

[[verticals]]
key = "hair"
label = "greffe de cheveux"
queries = ["greffe de cheveux", "greffe capillaire"]
match = ["greffe", "capillaire", "hair", "fue", "dhi", "implant capillaire"]

[[verticals]]
key = "dental"
label = "implants et dentisterie esthétique"
queries = ["implant dentaire", "centre dentaire", "dentiste esthétique", "orthodontiste"]
match = ["dent", "implant", "orthodon", "sourire", "smile", "stomato"]
types = ["dentist", "dental_clinic"]

[daily]
candidates = 60                # how many top prospects get a fresh check each day
dm_quota = 20                  # Instagram DMs Saad sends by hand
email_quota = 20               # generic business addresses only (contact@, info@, rdv@ ...)
call_quota = 10
recheck_days = 30              # re-audit a prospect's site after this many days

# Meta Ad Library API: commercial ads are only returned when they reached the EU (kept 1 year).
# Token: META_ADLIB_TOKEN (needs identity confirmed at facebook.com/ID + a Meta developer app).
[meta]
api_version = "v21.0"
countries = ["FR", "BE", "NL", "ES", "IT", "DE"]   # where the MRE and medical tourists are

[scoring]
hot = 60
warm = 40

# The AI employee (python -m sogixel serve). Secrets come from the environment, see DEPLOY.md.
[employee]
timezone = "Africa/Casablanca"
model = "claude-opus-5-5"
setter_effort = "medium"        # replies to prospects
polish_effort = "low"           # morning rewrite of the drafts
reply_delay_s = 20              # answer in seconds, not in milliseconds
prospect_tag = "prospect-sogixel"
first_touch = "Bonjour, je suis Saad, fondateur de SOGIXEL"   # the bot only answers conversations that start like this
daily_at = "07:30"
report_at = "18:00"
pull_day = 1                    # monthly refresh of the clinic list
followup_days = [3, 7]          # email relances after the approved first email
owner_channel = "whatsapp"      # how Saad gets notified
backup_at = "02:30"
backup_keep_days = 14
# Safety rails
max_replies_per_contact_day = 6 # then the bot hands the conversation to Saad
max_ai_replies_day = 150        # cost guard for the whole day
autoreply_window_s = 15         # a "reply" faster than this after ours is a clinic's auto-responder
# The only proof the setter may quote, word for word.
proof = ["Plus d'un million de dirhams de pipeline générés pour nos clients.",
         "Camelia Bio Cosmetics : pour 1 DH investi en publicité, 4 DH récupérés."]
