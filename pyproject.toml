[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daftar"
version = "0.1.0"
description = "AI back-office team for Moroccan fiduciaires (cabinets comptables), orchestrated on Claude Opus 5.5"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.9.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
daftar = "daftar.cli:main"

[tool.setuptools]
packages = ["daftar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
