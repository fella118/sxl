[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daftar"
version = "0.1.0"
description = "WhatsApp assistant that gets a Moroccan fiduciaire's clients to send their monthly documents on time"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.9.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
daftar = "daftar.cli:main"

[tool.setuptools]
packages = ["daftar"]

[tool.setuptools.package-data]
daftar = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
