<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Testimonial cover, host</title>
<link rel="stylesheet" href="../overlay/fonts/fonts.css">
<style>
  /* 1080x1920 reel cover (rendered at 2x = 2160x3840). Instagram's profile grid shows the centre
     3:4 (y 240-1680): the pill, the host's face and "12 ANS DE CONFIANCE" all sit inside it.
     host4k.png: C2406 frame 0 (the smile) from the 4K source, enhanced (studio/bin/enhance_photo.py);
     host4k_teeth.png: the same with the teeth whitened and the stains cleaned (retouch_teeth.py). */
  :root { --blue: #1b8fe0; --navy: #0a1f44; --yellow: #ffc93c; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0a1f44; }
  body { position: relative; font-family: "Cairo", sans-serif; -webkit-font-smoothing: antialiased; }
  #bg { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
  .shade { position: absolute; inset: 0;
           background: linear-gradient(to bottom, rgba(6,14,34,.42) 0%, rgba(6,14,34,0) 17%, rgba(6,14,34,0) 52%,
                                       rgba(6,14,34,.62) 64%, rgba(6,14,34,.9) 80%, rgba(6,14,34,.96) 100%); }
  #logo { position: absolute; left: 485px; top: 92px; width: 110px; height: 110px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.4)); }
  #pill { position: absolute; left: 0; width: 1080px; top: 276px; display: flex; justify-content: center; }
  #pill span { display: flex; align-items: center; gap: 18px; font: 400 64px/1 "Anton"; letter-spacing: 6px; color: #fff;
               background: var(--blue); padding: 16px 38px 14px 30px; border-radius: 60px; box-shadow: 0 14px 34px rgba(0,0,0,.35); }
  #pill svg { width: 56px; height: 56px; }
  #big { position: absolute; left: 0; width: 1080px; top: 1196px; text-align: center; }
  #big .n { font: 400 300px/0.88 "Anton"; color: var(--yellow); letter-spacing: 4px;
            text-shadow: 0 10px 0 rgba(10,31,68,.55), 0 22px 50px rgba(0,0,0,.45); }
  #big .c { font: 400 132px/1 "Anton"; color: #fff; letter-spacing: 3px; margin-top: 4px;
            text-shadow: 0 16px 40px rgba(0,0,0,.45); }
  #who { position: absolute; left: 0; width: 1080px; top: 1580px; text-align: center; font: 700 40px/1.2 "Cairo"; color: rgba(255,255,255,.9); }
  #who b { color: #fff; font-weight: 800; }
  #who i { font-style: normal; color: var(--yellow); }
</style>
</head>
<body>
  <img id="bg" src="host4k_teeth.png" alt="">
  <div class="shade"></div>

  <svg id="logo" viewBox="0 0 200 200" aria-label="SXL">
    <defs>
      <radialGradient id="lg" cx="38%" cy="30%" r="80%">
        <stop offset="0" stop-color="#4fb3f2"/><stop offset=".55" stop-color="#1b8fe0"/><stop offset="1" stop-color="#0b62b4"/>
      </radialGradient>
      <filter id="ls" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="3" dy="5" stdDeviation="3" flood-color="#06386e" flood-opacity=".55"/></filter>
    </defs>
    <circle cx="100" cy="100" r="96" fill="#fff"/>
    <circle cx="100" cy="100" r="88" fill="url(#lg)"/>
    <text x="100" y="128" text-anchor="middle" font-family="Anton" font-size="84" letter-spacing="1" fill="#fff" filter="url(#ls)">SXL</text>
  </svg>

  <div id="pill"><span>
    <svg viewBox="0 0 24 24"><path d="M4 5h16v10H9l-5 4z" fill="#fff"/><path d="M8 9h8M8 12h5" stroke="#1b8fe0" stroke-width="1.8" stroke-linecap="round"/></svg>
    AVIS CLIENTS</span></div>

  <div id="big"><div class="n">12 ANS</div><div class="c">DE CONFIANCE</div></div>
</body>
</html>
