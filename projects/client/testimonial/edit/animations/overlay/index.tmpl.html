<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --blue: #1b8fe0;          /* SXL logo blue */
    --blue-dk: #0b5fae;
    --ink: rgba(6, 12, 28, .62);
    --navy: #0a1f44;
    --yellow: #ffc93c;
  }
  html, body { margin: 0; width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
  body { font-family: "Cairo", sans-serif; -webkit-font-smoothing: antialiased; }
  .root { position: absolute; inset: 0; }
  .layer { position: absolute; visibility: hidden; opacity: 0; }
  .place { position: absolute; left: 0; top: 0; width: 1080px; height: 0; }

  /* ---------- SXL logo: small, top centre, no background, a touch see-through ---------- */
  #logo { left: 486px; top: 54px; width: 108px; height: 108px; opacity: .9; filter: drop-shadow(0 6px 14px rgba(0,0,0,.35)); }
  #tag { left: 0; width: 1080px; top: 176px; display: flex; justify-content: center; }
  #tag span { font: 400 34px/1 "Anton"; letter-spacing: 3px; color: #fff; background: rgba(10,20,40,.45); padding: 10px 22px 9px;
              border-radius: 40px; border: 2px solid rgba(255,255,255,.55); }

  /* ---------- karaoke captions ---------- */
  .kline { left: 40px; width: 1000px; top: 1180px; display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 12px; direction: rtl; }
  .run { display: flex; gap: 12px; }
  .run.ltr { direction: ltr; }
  .kw { font: 800 66px/1.3 "Cairo"; color: rgba(255,255,255,.62); padding: 0 14px 7px; border-radius: 18px; white-space: nowrap;
        -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 18px rgba(0,0,0,.4); display: inline-block; }
  .kw.lat { font: 400 66px/1.3 "Anton"; letter-spacing: 1px; padding-top: 2px; }
  .kw.said { color: #fff; }
  .kw.on { color: #fff; background: var(--blue); -webkit-text-stroke: 0; text-shadow: none; box-shadow: 0 8px 20px rgba(0,0,0,.3); }
  .kline.key .kw.on { color: var(--navy); background: var(--yellow); }
  .kline.key .kw { font-size: 76px; }

  /* ---------- name card ---------- */
  #name { left: 0; width: 1080px; top: 660px; display: flex; flex-direction: column; align-items: center; gap: 0; }
  #name .nm { font: 400 64px/1 "Anton"; letter-spacing: 2px; color: #fff; background: var(--blue); padding: 16px 30px 14px; border-radius: 18px 18px 0 0;
              box-shadow: 0 14px 30px rgba(0,0,0,.3); }
  #name .rl { font: 700 34px/1 "Cairo"; color: var(--navy); background: #fff; padding: 12px 26px 14px; border-radius: 0 0 18px 18px;
              box-shadow: 0 14px 30px rgba(0,0,0,.25); }
  #name .rl b { color: var(--blue-dk); font-weight: 800; }

  /* ---------- CTA ---------- */
  #cta { left: 0; width: 1080px; top: 1318px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #btn { display: flex; align-items: center; gap: 14px; background: #fff; color: var(--navy); border-radius: 60px; padding: 12px 26px 12px 24px;
         box-shadow: 0 14px 34px rgba(0,0,0,.35); border: 5px solid var(--blue); }
  #btn svg { width: 54px; height: 54px; }
  #btn .t1 { font: 400 46px/1 "Anton"; letter-spacing: 1px; }
  #btn .t2 { font: 400 46px/1 "Anton"; color: #fff; background: var(--blue); border-radius: 30px; padding: 8px 18px 7px; margin-left: 4px; }
  #btn #arrow { width: 50px; height: 50px; margin-left: 2px; }
</style>
</head>
<body>
<div class="root" id="front">
  <div id="kara"></div>

  <svg id="logo" class="layer" viewBox="0 0 200 200" aria-label="SXL">
    <defs>
      <radialGradient id="lg" cx="38%" cy="30%" r="80%">
        <stop offset="0" stop-color="#4fb3f2"/><stop offset=".55" stop-color="#1b8fe0"/><stop offset="1" stop-color="#0b62b4"/>
      </radialGradient>
      <filter id="ls" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="3" dy="5" stdDeviation="3" flood-color="#06386e" flood-opacity=".55"/></filter>
    </defs>
    <circle cx="100" cy="100" r="96" fill="#fff"/>
    <circle cx="100" cy="100" r="88" fill="url(#lg)"/>
    <text x="100" y="128" text-anchor="middle" font-family="Anton" font-size="84" letter-spacing="1" fill="#fff" filter="url(#ls)">SXL</text>
  </svg>
  <div id="tag" class="layer"><span>AVIS CLIENT</span></div>

  <div id="name" class="layer">
    <div class="nm">DNANOU ATAE</div>
    <div class="rl">Fondateur · <b>Gzenaya Optique</b></div>
  </div>

  <div id="cta" class="layer">
    <div id="btn">
      <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3" fill="none" stroke="#1b8fe0" stroke-width="2.2"/>
        <path d="M8 8h8M8 12h8M8 16h5" stroke="#0a1f44" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span class="t1">FORMULAIRE</span><span class="t2" id="t30">30 S</span>
      <svg id="arrow" viewBox="0 0 24 24"><path d="M12 4v14M6 12l6 6 6-6" fill="none" stroke="#1b8fe0" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>
</div>
<div class="root" id="back"></div>

<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="events.js"></script>
<script src="facepos.js"></script>
<script>
const E = window.EV, FACE = window.FACE || { fps: 50, frames: [] };
const LAYER = new URLSearchParams(location.search).get("layer") || "all";
if (LAYER === "back") document.getElementById("front").style.display = "none";
if (LAYER === "front") document.getElementById("back").style.display = "none";
const tl = gsap.timeline({ paused: true });
const back = "back.out(1.7)", out3 = "power3.out", in3 = "power3.in";
const AR = /[؀-ۿ]/;
const $ = (id) => document.getElementById(id);

// ---------- logo + tag ----------
tl.set("#logo", { autoAlpha: 0.9 }, 0);
tl.fromTo("#tag", { autoAlpha: 0, y: -10 }, { autoAlpha: 1, y: 0, duration: 0.25, ease: out3 }, 0.15);
tl.to("#tag", { autoAlpha: 0, duration: 0.25 }, E.tag_out - 0.25);

// ---------- karaoke lines: same-script runs keep their reading order ----------
const kara = $("kara");
const KL = E.lines.map((ln, k) => {
  const el = document.createElement("div");
  el.className = "layer kline" + (ln.key ? " key" : ""); el.id = "kl" + k;
  const allLat = ln.words.every(wd => !AR.test(wd.t));
  if (allLat) el.style.direction = "ltr";
  const spans = [];
  let run = null, runLat = null;
  ln.words.forEach(wd => {
    const lat = !AR.test(wd.t);
    if (!run || lat !== runLat) {
      run = document.createElement("span"); run.className = "run" + (lat ? " ltr" : ""); runLat = lat; el.appendChild(run);
    }
    const sp = document.createElement("span");
    sp.className = "kw" + (lat ? " lat" : ""); sp.textContent = wd.t;
    run.appendChild(sp); spans.push(sp);
  });
  if (ln.start >= E.cta_btn - 0.1) el.style.top = "1196px";     // CTA: captions sit above the button
  kara.appendChild(el);
  tl.fromTo(el, { autoAlpha: 0, y: 26 }, { autoAlpha: 1, y: 0, duration: 0.14, ease: out3 }, ln.start - 0.08);
  tl.to(el, { autoAlpha: 0, duration: 0.1 }, ln.end - 0.1);
  return { el, spans, ln };
});

// ---------- name card ----------
tl.fromTo("#name .nm", { clipPath: "inset(0 50% 0 50%)" }, { clipPath: "inset(0 0% 0 0%)", duration: 0.35, ease: out3 }, E.name_in);
tl.fromTo("#name", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: out3 }, E.name_in);
tl.fromTo("#name .rl", { autoAlpha: 0, y: -12 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: out3 }, E.name_in + 0.2);
tl.to("#name", { autoAlpha: 0, y: -10, duration: 0.25, ease: in3 }, E.name_out - 0.25);

// ---------- CTA: button + arrow to the link under the video ----------
tl.fromTo("#cta", { autoAlpha: 0, y: 30, scale: 0.85 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.35, ease: back }, E.cta_btn);
tl.fromTo("#arrow", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2 }, E.cta_arrow - 0.1);
tl.to("#t30", { keyframes: [{ scale: 1.18, duration: 0.12 }, { scale: 1, duration: 0.2 }] }, E.cta_30);
tl.to("#btn", { keyframes: [{ scale: 1.05, duration: 0.12 }, { scale: 1, duration: 0.2 }] }, E.cta_30);

// ---------- deterministic seek ----------
window.seek = (t) => {
  tl.seek(Math.max(t, 0.001), false);
  KL.forEach(({ spans, ln }) => {
    if (t < ln.start - 0.1 || t > ln.end + 0.05) return;
    let cur = -1;
    ln.words.forEach((wd, i) => { if (t >= wd.at - 0.02) cur = i; });
    spans.forEach((sp, i) => {
      sp.classList.toggle("on", i === cur);
      sp.classList.toggle("said", i < cur);
      const pop = i === cur ? Math.max(0, 1 - (t - ln.words[i].at) / 0.14) : 0;
      sp.style.transform = `scale(${(1 + 0.08 * pop).toFixed(3)})`;
    });
  });
  // the arrow bobs toward the link while it is on screen
  if (t >= E.cta_arrow) $("arrow").style.transform = `translateY(${(8 * Math.sin((t - E.cta_arrow) * 2 * Math.PI * 1.6)).toFixed(1)}px)`;
};
window.anyVisible = () => {
  const scope = LAYER === "all" ? document : document.getElementById(LAYER);
  return Array.from(scope.querySelectorAll(".layer")).some(el => {
    const cs = getComputedStyle(el);
    return cs.visibility !== "hidden" && parseFloat(cs.opacity) > 0.001;
  });
};

/*FITPLACE*/

function placeAll() {
  KL.forEach(({ el, ln }) => placeItem(el, "below", ln.start, ln.end, { cx: 540 }));
  placeItem($("name"), "above", E.name_in, E.name_out, { cx: 540 });
  placeItem($("cta"), "below", E.cta_btn, E.duration, { cx: 540, extra: 0 });
}

window.ready = (async () => {
  const faces = ['800 66px "Cairo"', '700 34px "Cairo"', '400 66px "Anton"'];
  await Promise.all(faces.flatMap(f => [document.fonts.load(f, "abc éû"), document.fonts.load(f, "واش")]));
  await document.fonts.ready;
  const missing = faces.filter(f => !document.fonts.check(f, f.includes("Cairo") ? "abc واش" : "abc éû"));
  if (missing.length) throw new Error("fonts not loaded: " + missing.join(", "));
  placeAll();
  return true;
})();
</script>
</body>
</html>
