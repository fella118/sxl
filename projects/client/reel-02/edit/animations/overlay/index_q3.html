<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --navy: #01115f;          /* Gzenaya Optique logo blue */
    --navy-soft: rgba(1, 17, 95, .08);
    --yellow: #ffc93c;
    --gold: #c98f00;          /* yellow that reads on white */
    --red: #ff4d5e;
    --ok: #2fbf71;
    --ink: rgba(8, 10, 22, .58);
    --muted: #6b7290;
  }
  html, body { margin: 0; width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
  body { font-family: "Cairo", sans-serif; -webkit-font-smoothing: antialiased; }
  .root { position: absolute; inset: 0; }
  .layer { position: absolute; visibility: hidden; opacity: 0; }
  svg.full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }

  /* ---------- phrase typography (house style v3, navy edition) ---------- */
  .place { position: absolute; left: 0; top: 0; width: 1080px; height: 0; }
  .phrase { left: 520px; display: flex; flex-direction: column; align-items: center; width: 1000px; }
  .phrase.inline { position: relative; left: 0; width: auto; }
  .line { display: flex; align-items: baseline; justify-content: center; gap: 22px; line-height: 1.02; }
  .run { display: flex; align-items: baseline; gap: 18px; }
  .w { position: relative; display: inline-block; white-space: nowrap; paint-order: stroke fill;
       text-shadow: 0 10px 28px rgba(0,0,0,.45); }
  .w .ghost { position: absolute; inset: 0; -webkit-text-stroke: 0; text-shadow: none; opacity: 0; pointer-events: none; }
  .small  { font: 700 56px/1.05 "Cairo"; color: rgba(255,255,255,.96); -webkit-text-stroke: 8px var(--ink); }
  .key    { font: 900 150px/1.0 "Cairo"; color: #fff; -webkit-text-stroke: 14px var(--ink); }
  .key.lat { font: 400 168px/0.98 "Anton"; text-transform: uppercase; letter-spacing: 1px; }
  .script { font: 400 126px/1.0 "Great Vibes"; color: var(--yellow); -webkit-text-stroke: 7px var(--ink);
            margin-bottom: -26px; transform: rotate(-4deg); padding: 0 18px; }
  .num    { font: 400 250px/0.95 "Anton"; color: #fff; -webkit-text-stroke: 16px var(--ink); }
  .yellow { color: var(--yellow); } .red { color: var(--red); }
  /* navy words wear a white outline (navy on his navy shirt would vanish) */
  .w.navy { color: var(--navy); -webkit-text-stroke-color: #fff !important; }
  .w.navy.key { -webkit-text-stroke-width: 16px; }
  .w.navy.num { -webkit-text-stroke-width: 18px; }

  /* white cards with navy type: the logo's look */
  .panel { background: rgba(255,255,255,.97); border: 6px solid var(--navy); border-radius: 38px; color: var(--navy);
           box-shadow: 0 26px 60px rgba(0,0,0,.35); }

  /* ---------- question card ---------- */
  .quiz { left: 290px; top: 210px; width: 500px; height: 300px; }
  .quiz .qc { position: absolute; inset: 0; border-radius: 48px; background: var(--yellow); color: var(--navy);
              border: 8px solid #fff; box-shadow: 0 30px 70px rgba(0,0,0,.45), inset 0 -14px 0 rgba(0,0,0,.12);
              display: flex; align-items: center; justify-content: center; direction: rtl; }
  .quiz .ql { font: 900 150px/1 "Cairo"; }
  .quiz .qmark { position: absolute; right: -44px; top: -56px; width: 140px; height: 140px; border-radius: 50%;
                 background: var(--navy); border: 7px solid #fff; display: grid; place-items: center;
                 font: 400 100px/1 "Anton"; color: #fff; box-shadow: 0 14px 30px rgba(0,0,0,.35); }
  .quiz .spark { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: #fff; }

  /* ---------- corner chip: سؤال | جواب ---------- */
  .chip { left: 56px; top: 150px; height: 84px; display: flex; align-items: center; gap: 14px; direction: rtl;
          padding: 0 30px 0 14px; border-radius: 42px; border: 4px solid #fff; box-shadow: 0 12px 30px rgba(0,0,0,.35);
          font: 900 46px/1 "Cairo"; transform-origin: 0% 50%; }
  .chip.q { background: var(--yellow); color: var(--navy); }
  .chip.a { background: var(--navy); color: #fff; }
  .chip .ico { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font: 400 40px/1 "Anton"; }
  .chip.q .ico { background: var(--navy); color: #fff; }
  .chip.a .ico { background: #fff; color: var(--navy); }

  /* ---------- "جواب" wall (back layer) ---------- */
  .wall { left: -200px; top: 60px; width: 1480px; }
  .wrow { display: flex; gap: 60px; white-space: nowrap; font: 900 250px/1.0 "Cairo"; margin: -22px 0; }
  .wrow span.f { color: var(--navy); }
  .wrow span.o { color: #fff; filter: url(#outlineW); }

  /* ---------- Q1 price tag ---------- */
  #tag { left: 340px; top: 0; width: 400px; height: 560px; }
  #tagswing { position: absolute; left: 0; top: 0; width: 400px; height: 560px; transform-origin: 200px 0px; }
  #tagstring { position: absolute; left: 198px; top: 0; width: 4px; height: 300px; background: rgba(255,255,255,.85); }
  #tagbody { position: absolute; left: 30px; top: 290px; width: 340px; height: 190px; }
  #tagbody svg { position: absolute; inset: 0; width: 340px; height: 190px; overflow: visible; }
  #tagtext { position: absolute; left: 70px; right: 10px; top: 22px; display: flex; align-items: baseline; justify-content: center; gap: 14px;
             font: 400 104px/1 "Anton"; color: var(--navy); }
  #tagdh { font: 400 60px/1 "Anton"; color: var(--red); }

  /* ---------- A1 speech bubble (the optician) ---------- */
  #said { left: 90px; top: 250px; width: 900px; display: flex; align-items: flex-end; gap: 22px; direction: ltr; }
  #said .who { width: 150px; flex: none; text-align: center; }
  #said .av { width: 140px; height: 140px; border-radius: 50%; background: #fff; border: 6px solid var(--navy);
              display: grid; place-items: center; margin: 0 auto; }
  #said .nm { font: 700 34px/1.2 "Cairo"; color: #fff; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; margin-top: 6px; }
  #said .bub { position: relative; flex: 1; background: #fff; color: var(--navy); border-radius: 44px; padding: 26px 36px;
               border: 5px solid var(--navy); box-shadow: 0 24px 60px rgba(0,0,0,.4); min-height: 96px; }
  #said .bub:after { content: ""; position: absolute; left: -30px; bottom: 30px; border: 22px solid transparent;
                     border-right: 34px solid var(--navy); border-left: 0; }
  #saidtext { font: 800 62px/1.25 "Cairo"; unicode-bidi: plaintext; text-align: start; }
  #saidtext b { color: #fff; background: var(--navy); font-weight: 900; padding: 0 14px; border-radius: 14px; }
  #saidtext .dots { color: var(--red); }

  /* ---------- A1 white card pointer ---------- */
  #callout { left: 0; top: 0; width: 1080px; height: 1920px; }
  #co-label { position: absolute; left: 380px; top: 560px; width: 480px; display: flex; align-items: center; justify-content: center; gap: 18px;
              background: var(--navy); border: 5px solid #fff; border-radius: 40px; padding: 18px 26px; color: #fff;
              font: 400 76px/1 "Anton"; letter-spacing: 1px; box-shadow: 0 18px 40px rgba(0,0,0,.4); }
  #co-label svg { width: 70px; height: 70px; }
  #co-arrow { position: absolute; left: 580px; top: 690px; width: 80px; height: 150px; overflow: visible; }

  /* ---------- A2 index table ---------- */
  #table { left: 90px; top: 140px; width: 900px; }
  #table .panel { padding: 22px 30px 26px; }
  .trow { display: grid; grid-template-columns: 1fr 1fr; align-items: center; height: 104px; border-radius: 24px; padding: 0 18px; }
  .thead { height: 86px; margin-bottom: 6px; }
  .thead div { font: 800 46px/1 "Cairo"; color: rgba(1,17,95,.55); text-align: center; padding: 14px 0; border-radius: 22px; }
  .tr { opacity: 0; visibility: hidden; margin-top: 8px; background: var(--navy-soft); }
  .tr .c { font: 400 72px/1 "Anton"; color: var(--navy); text-align: center; letter-spacing: 1px; }
  .tr .i { font: 400 82px/1 "Anton"; color: var(--navy); text-align: center; letter-spacing: 1px; white-space: nowrap; }
  .tr .i span { display: inline-block; opacity: 0; }
  .tr .i .m { color: var(--gold); font-size: 64px; }
  .tr .arr { color: rgba(1,17,95,.45); margin: 0 10px; }

  /* ---------- A2 lens card ---------- */
  #lens { left: 110px; top: 140px; width: 860px; }
  #lens .panel { padding: 30px 36px 30px; display: flex; flex-direction: column; align-items: center; }
  #lens .top { display: flex; align-items: center; gap: 30px; }
  #lens .disc { width: 170px; height: 170px; flex: none; }
  #lens .nm { display: flex; flex-direction: column; align-items: flex-start; }
  #lens .nm .a { font: 400 112px/0.95 "Anton"; letter-spacing: 2px; color: var(--navy); }
  #lens .nm .b { font: 400 104px/0.8 "Great Vibes"; color: var(--gold); margin: -6px 0 0 120px; }
  #lens .pills { display: flex; gap: 18px; margin-top: 22px; direction: ltr; }
  .pill { padding: 10px 26px; border-radius: 40px; font: 800 48px/1.1 "Cairo"; opacity: 0; visibility: hidden; }
  .pill.c { background: var(--navy); color: #fff; }
  .pill.y { background: var(--yellow); color: var(--navy); }
  .pill.g { background: var(--navy-soft); border: 3px solid var(--navy); color: var(--navy); }
  #lens .cmp { display: flex; gap: 70px; margin-top: 22px; height: 0; overflow: hidden; opacity: 0; }
  #lens .prof { text-align: center; }
  #lens .prof svg { width: 200px; height: 190px; overflow: visible; }
  #lens .prof .lb { font: 400 46px/1.1 "Anton"; letter-spacing: 1px; color: var(--muted); }
  #lens .prof .lb.nv { color: var(--navy); }

  /* ---------- A3 frame-arm diagram ---------- */
  #arm { left: 70px; top: 140px; width: 940px; }
  #arm .panel { padding: 30px 30px 34px; }
  #arm .ttl { font: 800 46px/1 "Cairo"; color: var(--navy); text-align: center; margin-bottom: 18px; direction: rtl; }
  #armsvg { width: 880px; height: 240px; overflow: visible; }
  #arm .tags { display: flex; justify-content: center; gap: 30px; margin-top: 10px; height: 110px; direction: ltr; }
  .tagp { display: flex; align-items: center; gap: 12px; padding: 8px 28px; border-radius: 30px; font: 400 76px/1.1 "Anton";
          letter-spacing: 1px; opacity: 0; visibility: hidden; }
  .tagp.max { background: var(--red); color: #fff; }
  .tagp.ok { background: var(--ok); color: #fff; }
  .tagp svg { width: 60px; height: 60px; }

  /* ---------- teaser: next video ---------- */
  #next { left: 110px; top: 140px; width: 860px; }
  #next .panel { padding: 26px 34px 30px; text-align: center; }
  #next .hd { display: flex; align-items: center; justify-content: center; gap: 20px; font: 400 64px/1 "Great Vibes"; color: var(--gold); }
  #next .hd b { font: 900 70px/1 "Cairo"; color: var(--navy); }
  #next .play { width: 84px; height: 84px; border-radius: 50%; background: var(--red); display: grid; place-items: center; }
  #next .case { font: 400 150px/1 "Anton"; letter-spacing: 3px; color: var(--navy); margin: 14px 0 6px; opacity: 0; visibility: hidden; }
  #next .rx { display: flex; justify-content: center; align-items: center; gap: 26px; direction: rtl; }
  .rxc { width: 290px; padding: 18px 0 16px; border-radius: 28px; background: #eef1f8; color: var(--navy); opacity: 0; visibility: hidden; }
  .rxc .t { font: 900 54px/1.1 "Cairo"; }
  .rxc .s { font: 400 40px/1.2 "Anton"; color: var(--muted); letter-spacing: 1px; direction: ltr; }
  .rxc.old { filter: grayscale(1); opacity: .8; }
  .rxc.new { border: 6px solid var(--ok); }
  #next .rxa { width: 90px; height: 60px; opacity: 0; visibility: hidden; }

  /* ---------- CTA: save button ---------- */
  #save { left: 240px; top: 1180px; width: 600px; height: 220px; }
  #save .btn { position: absolute; left: 0; top: 10px; width: 200px; height: 200px; border-radius: 56px; background: #fff;
               border: 6px solid var(--navy); box-shadow: 0 30px 70px rgba(0,0,0,.45); display: grid; place-items: center; }
  #save .btn svg { width: 120px; height: 120px; overflow: visible; }
  #save .lbl { position: absolute; left: 240px; top: 30px; font: 400 160px/1 "Anton"; letter-spacing: 6px;
               color: var(--navy); -webkit-text-stroke: 16px #fff; paint-order: stroke fill; text-shadow: 0 10px 28px rgba(0,0,0,.4); }
  #save .burst { position: absolute; left: 100px; top: 110px; width: 0; height: 0; }
  #save .burst i { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; }
  #tap { position: absolute; left: 90px; top: 110px; width: 100px; height: 100px; opacity: 0; visibility: hidden; }
</style>
</head>

<script>
const E = window.EV, FACE = window.FACE || { fps: 50, frames: [] };
const LAYER = new URLSearchParams(location.search).get("layer") || "all";
if (LAYER === "back") document.getElementById("front").style.display = "none";
if (LAYER === "front") document.getElementById("back").style.display = "none";

const tl = gsap.timeline({ paused: true });
const back = "back.out(1.7)", out3 = "power3.out", in3 = "power3.in", io3 = "power3.inOut", expo = "expo.out";
const AR = /[؀-ۿ]/;
const SVGNS = "http://www.w3.org/2000/svg";
const defs = document.getElementById("fxdefs");
let fxId = 0;

// Horizontal (or vertical) motion blur filter for one element; returns the blur node to animate.
function motionBlur(el) {
  const f = document.createElementNS(SVGNS, "filter");
  f.setAttribute("id", "mb" + (++fxId));
  f.setAttribute("x", "-60%"); f.setAttribute("y", "-60%"); f.setAttribute("width", "220%"); f.setAttribute("height", "220%");
  const b = document.createElementNS(SVGNS, "feGaussianBlur");
  b.setAttribute("stdDeviation", "0 0");
  f.appendChild(b); defs.appendChild(f);
  el.style.filter = `url(#mb${fxId})`;
  return b;
}
function addGhosts(el, color) {
  return [0, 1].map(i => {
    const g = document.createElement("span");
    g.className = "ghost"; g.textContent = el.dataset.text; g.style.color = color;
    el.appendChild(g); return g;
  });
}

// ---------- phrase typography ----------
const ACCENT = { navy: "#ffffff", yellow: "#ffc93c", red: "#ff4d5e" };
const phrasesEl = document.getElementById("phrases");
E.phrases.forEach(p => {
  const ph = document.createElement("div");
  ph.className = "layer phrase" + (p.parent ? " inline" : "");
  if (!p.parent) { ph.style.top = p.y + "px"; ph.style.left = p.x + "px"; }
  (p.parent ? document.getElementById(p.parent) : phrasesEl).appendChild(ph);
  ph.dataset.place = p.place; ph.dataset.t0 = p.start; ph.dataset.t1 = p.end;
  const words = [];
  p.lines.forEach(line => {
    const lineDir = AR.test(line[0].t) ? "rtl" : "ltr";
    const ln = document.createElement("div");
    ln.className = "line"; ln.style.direction = lineDir;
    ph.appendChild(ln);
    // group same-script neighbours into runs so mixed lines keep their reading order
    let run = null, runDir = null;
    line.forEach(wd => {
      const dir = AR.test(wd.t) ? "rtl" : (/[A-Za-zÀ-ÿ]/.test(wd.t) ? "ltr" : lineDir);
      if (!run || dir !== runDir) {
        run = document.createElement("div"); run.className = "run"; run.style.direction = dir; runDir = dir;
        ln.appendChild(run);
      }
      const el = document.createElement("span");
      const lat = dir === "ltr";
      el.className = `w ${wd.role}${lat && wd.role === "key" ? " lat" : ""}${wd.color ? " " + wd.color : ""}`;
      el.textContent = wd.t; el.dataset.text = wd.t;
      run.appendChild(el);
      words.push({ el, wd, dir });
    });
  });
  tl.set(ph, p.parent ? { autoAlpha: 1 } : { autoAlpha: 1, xPercent: -50 }, p.start - 0.06);
  words.forEach(({ el, wd, dir }) => {
    const at = wd.at - 0.04, sign = dir === "rtl" ? 1 : -1;
    if (wd.role === "small") {
      tl.fromTo(el, { autoAlpha: 0, y: 34 }, { autoAlpha: 1, y: 0, duration: 0.2, ease: out3 }, at);
    } else if (wd.role === "script") {
      tl.fromTo(el, { autoAlpha: 1, clipPath: "inset(-30% 100% -30% -10%)", y: 14 },
                    { clipPath: "inset(-30% -10% -30% -10%)", y: 0, duration: 0.42, ease: "power2.inOut" }, at);
    } else {
      const blur = motionBlur(el);
      const ghosts = addGhosts(el, ACCENT[wd.color] || "#ffc93c");
      const num = wd.role === "num";
      tl.fromTo(el, num ? { autoAlpha: 0, scale: 0.35, rotation: -10 } : { autoAlpha: 0, scale: 1.35, x: sign * 60 },
                    num ? { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.34, ease: "back.out(2.2)" }
                        : { autoAlpha: 1, scale: 1, x: 0, duration: 0.26, ease: expo }, at);
      // dark outline/shadow fade in after the blur, so the smear stays word-shaped
      tl.fromTo(el, { webkitTextStrokeColor: "rgba(8,10,22,0)", textShadow: "0 10px 28px rgba(0,0,0,0)" },
                    { webkitTextStrokeColor: "rgba(8,10,22,0.58)", textShadow: "0 10px 28px rgba(0,0,0,0.45)", duration: 0.2, ease: "power1.in" }, at + 0.06);
      tl.fromTo(blur, { attr: { stdDeviation: num ? "0 12" : "12 0" } }, { attr: { stdDeviation: "0 0" }, duration: 0.24, ease: "power2.out" }, at);
      ghosts.forEach((g, i) => tl.fromTo(g, num ? { opacity: 0.45 - 0.17 * i, y: 50 * (i + 1) } : { opacity: 0.5 - 0.18 * i, x: sign * 46 * (i + 1) },
                                            { opacity: 0, x: 0, y: 0, duration: 0.32 + 0.1 * i, ease: out3 }, at + 0.02));
    }
  });
  tl.to(words.map(w => w.el), { autoAlpha: 0, y: -26, duration: 0.16, ease: "power2.in", stagger: 0.015 }, p.end - 0.16);
  tl.set(ph, { autoAlpha: 0 }, p.end + 0.08);
});

window.anyVisible = () => {

    const cs = getComputedStyle(el);

// Shrink a phrase line that would overflow the safe width (measured once fonts are in).
function fitLines(maxW = 860) {
  document.querySelectorAll(".phrase .line").forEach(ln => {
    const ph = ln.closest(".phrase");
    const prev = [ph.style.visibility, ph.style.opacity];
    ph.style.visibility = "visible";
    const w = ln.scrollWidth;
    if (w > maxW) {
      const k = maxW / w;
      ln.querySelectorAll(".w").forEach(el => {
        el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * k).toFixed(1) + "px";
      });
    }
    ph.style.visibility = prev[0];
  });
}

// ---------- safe placement: never over the head, inside the Instagram safe area ----------
const TOP_SAFE = 140, BOTTOM_SAFE = 1420, HEAD_MARGIN = 36;
function headStats(t0, t1) {
  let top = Infinity, chin = -Infinity;
  for (let i = Math.floor(t0 * FACE.fps); i <= Math.ceil(t1 * FACE.fps); i++) {
    const f = FACE.frames[i];
    if (!f || f[3] === undefined) continue;
    top = Math.min(top, f[3]); chin = Math.max(chin, f[4]);
  }
  return { top, chin };
}
function wrap(el) {
  const w = document.createElement("div"); w.className = "place";
  el.parentNode.insertBefore(w, el); w.appendChild(el); return w;
}
function placeItem(el, mode, t0, t1, opts = {}) {
  const top = el.offsetTop, h = el.offsetHeight + (opts.extra || 0);
  const cx = opts.cx ?? el.offsetLeft + el.offsetWidth / 2;
  const hs = headStats(t0, t1);
  let newTop = top, k = 1;
  if (mode === "above" && isFinite(hs.top)) {
    const maxB = hs.top - HEAD_MARGIN;
    if (!(top >= TOP_SAFE && top + h <= maxB)) {
      newTop = Math.max(TOP_SAFE, Math.min(top, maxB - h));
      if (newTop + h > maxB) k = Math.max(0.5, (maxB - newTop) / h);
    }
  } else if (mode === "below" && isFinite(hs.chin)) {
    const minT = hs.chin + HEAD_MARGIN;
    if (!(top >= minT && top + h <= BOTTOM_SAFE)) {
      newTop = Math.max(minT, Math.min(top, BOTTOM_SAFE - h));
      if (newTop + h > BOTTOM_SAFE) k = Math.max(0.5, (BOTTOM_SAFE - newTop) / h);
    }
  }
  if (newTop === top && k === 1) return;
  const w = wrap(el);
  w.style.transformOrigin = `${cx}px ${top}px`;
  w.style.transform = `translate(0px, ${(newTop - top).toFixed(1)}px) scale(${k.toFixed(3)})`;
  window.PLACED.push({ id: el.id || el.className, mode, top, newTop: Math.round(newTop), h, k: +k.toFixed(3) });
}
window.PLACED = [];

function placeAll() {
  document.querySelectorAll("#phrases > .phrase").forEach(ph =>
    placeItem(ph, ph.dataset.place, +ph.dataset.t0, +ph.dataset.t1, { cx: parseFloat(ph.style.left) }));
  E.quiz.forEach((q, k) => placeItem($("quiz" + k), "above", q.t, q.t + 1.2));
  if (E.tag_in !== undefined) placeItem($("tag"), "above", E.tag_in, E.tag_out);
  if (E.said_in !== undefined) placeItem($("said"), "above", E.said_in, E.said_out);
  if (E.table_in !== undefined) placeItem($("table"), "above", E.table_in + 0.45, E.table_out);   // after the camera tilt
  if (E.lens_in !== undefined) placeItem($("lens"), "above", E.lens_in, E.lens_out, { extra: 250 });
  if (E.arm_in !== undefined) placeItem($("arm"), "above", E.arm_in, E.arm_out);
  if (E.next_in !== undefined) placeItem($("next"), "above", E.next_in, E.next_out);
  placeItem($("save"), "below", E.save_in, E.duration);
}

window.ready = (async () => {
  const faces = ['900 150px "Cairo"', '800 46px "Cairo"', '700 56px "Cairo"', '400 168px "Anton"', '400 126px "Great Vibes"'];
  await Promise.all(faces.flatMap(f => [document.fonts.load(f, "abc éû"), document.fonts.load(f, "واش")]));
  await document.fonts.ready;
  const missing = faces.filter(f => !document.fonts.check(f, f.includes("Cairo") ? "abc واش" : "abc éû"));
  if (missing.length) throw new Error("fonts not loaded: " + missing.join(", "));
  await Promise.all(Array.from(document.images).map(img => img.decode()));
  // table rows are measured at full height (they start hidden)
  fitLines();
  placeAll();
  return true;
})();
