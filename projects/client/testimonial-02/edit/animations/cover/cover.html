<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Testimonial 02 cover</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* 1080x1920 reel cover (rendered at 2x = 2160x3840). Instagram's profile grid shows the centre
     3:4 (y 240-1680): the pill, her face and both quotes sit inside it.
     Same series look as the first testimonial cover: SXL logo, blue pill, navy shade, Anton keywords in yellow. */
  :root { --blue: #1b8fe0; --navy: #0a1f44; --yellow: #ffc93c; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0a1f44; }
  body { position: relative; font-family: "Cairo", sans-serif; -webkit-font-smoothing: antialiased; }
  #bg { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
  .shade { position: absolute; inset: 0;
           background: linear-gradient(to bottom, rgba(6,14,34,.40) 0%, rgba(6,14,34,0) 15%, rgba(6,14,34,0) 54%,
                                       rgba(6,14,34,.58) 63%, rgba(6,14,34,.88) 75%, rgba(6,14,34,.96) 100%); }
  #logo { position: absolute; left: 485px; top: 84px; width: 110px; height: 110px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.4)); }
  #pill { position: absolute; left: 0; width: 1080px; top: 244px; display: flex; justify-content: center; }
  #pill span { display: flex; align-items: center; gap: 18px; font: 400 62px/1 "Anton"; letter-spacing: 6px; color: #fff;
               background: var(--blue); padding: 16px 38px 14px 30px; border-radius: 60px; box-shadow: 0 14px 34px rgba(0,0,0,.35); }
  #pill svg { width: 54px; height: 54px; }

  #quotes { position: absolute; left: 0; width: 1080px; top: 1172px; text-align: center; color: #fff; }
  .l { display: block; white-space: nowrap; }
  .s { font: 800 66px/1.1 "Cairo"; text-shadow: 0 6px 22px rgba(0,0,0,.5); }
  .k { font: 400 136px/0.96 "Anton"; color: var(--yellow); letter-spacing: 3px;
       text-shadow: 0 8px 0 rgba(10,31,68,.55), 0 18px 44px rgba(0,0,0,.45); }
  .m { font: 400 120px/0 "Great Vibes"; color: var(--yellow); position: relative; top: .36em;
       text-shadow: 0 6px 18px rgba(0,0,0,.35); }                       /* curly quote marks, hung at cap height */
  .m.lg { font-size: 176px; top: .1em; }                                /* next to an Anton keyword */
  .m.o { margin-right: 10px; } .m.c { margin-left: 2px; }
  .stars { display: flex; justify-content: center; gap: 12px; margin: 26px 0 22px; }
  .stars svg { width: 38px; height: 38px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.4)); }
</style>
</head>
<body>
  <img id="bg" src="her4k.png" alt="">
  <div class="shade"></div>

  <svg id="logo" viewBox="0 0 200 200" aria-label="SXL">
    <defs>
      <radialGradient id="lg" cx="38%" cy="30%" r="80%">
        <stop offset="0" stop-color="#4fb3f2"/><stop offset=".55" stop-color="#1b8fe0"/><stop offset="1" stop-color="#0b62b4"/>
      </radialGradient>
      <filter id="ls" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="3" dy="5" stdDeviation="3" flood-color="#06386e" flood-opacity=".55"/></filter>
    </defs>
    <circle cx="100" cy="100" r="96" fill="#fff"/>
    <circle cx="100" cy="100" r="88" fill="url(#lg)"/>
    <text x="100" y="128" text-anchor="middle" font-family="Anton" font-size="84" letter-spacing="1" fill="#fff" filter="url(#ls)">SXL</text>
  </svg>

  <div id="pill"><span>
    <svg viewBox="0 0 24 24"><path d="M4 5h16v10H9l-5 4z" fill="#fff"/><path d="M8 9h8M8 12h5" stroke="#1b8fe0" stroke-width="1.8" stroke-linecap="round"/></svg>
    AVIS CLIENT</span></div>

  <div id="quotes">
    <div class="q">
      <span class="l"><span class="m o">“</span><span class="s">Kan </span><span class="k">LE RETOUR</span></span>
      <span class="l"><span class="s">sarahatan…</span><span class="m c">”</span></span>
    </div>
    <div class="stars"><svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z" fill="#ffc93c"/></svg><svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z" fill="#ffc93c"/></svg><svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z" fill="#ffc93c"/></svg><svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z" fill="#ffc93c"/></svg><svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z" fill="#ffc93c"/></svg></div>
    <div class="q">
      <span class="l"><span class="m o">“</span><span class="s">Nass liknt bagha</span></span>
      <span class="l"><span class="k">HOMA LI JAW…</span><span class="m c lg">”</span></span>
    </div>
  </div>
</body>
</html>
