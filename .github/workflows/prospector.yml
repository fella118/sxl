name: prospector

on:
  push:
    paths: ["prospector/**", ".github/workflows/prospector.yml"]
  pull_request:
    paths: ["prospector/**", ".github/workflows/prospector.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prospector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: prospector
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sogixel-employee:latest
            ghcr.io/${{ github.repository_owner }}/sogixel-employee:${{ github.sha }}
